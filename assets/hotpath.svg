<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180" viewBox="0 0 240 180" role="img" aria-labelledby="title desc">
<title id="title">.NET application hot path — animated profile</title>
<desc id="desc">An animated, illustrative application call-flow profile from ASP.NET through C sharp business logic, ADO.NET and SQL Server, with a WCF or ASMX integration branch. The bar widths are visual only and are not measured timings. Open this SVG directly to hover individual frames for descriptions.</desc>
<style>
  svg{--tx:#1d1d1f;--mu:#6e6e73;--ac:#0071e3;--bd:#d2d2d7;--sf:#f5f5f7;--grid:#e5e5ea;--on:#ffffff}
  @media(prefers-color-scheme:dark){svg{--tx:#f5f5f7;--mu:#98989d;--ac:#2997ff;--bd:#38383a;--sf:#1c1c1e;--grid:#2c2c2e;--on:#ffffff}}
  .m{font-family:'SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .b{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
  .card{fill:var(--sf);stroke:var(--bd);stroke-width:1}
  .fr{fill:var(--grid);stroke:var(--sf);stroke-width:1}
  .hot{fill:var(--ac)}
  .lbl{font-size:8.2px;fill:var(--tx)}
  .lbl.on{fill:var(--on)}
  .st{opacity:0;animation:stack 6s ease-out infinite}
  .glow{animation:pulse 1.4s ease-in-out infinite}
  .st:hover .fr{stroke:var(--ac);stroke-width:1.8;filter:brightness(1.08)}
  .st:hover .lbl{font-weight:700}
  @keyframes stack{0%{opacity:0;transform:translateY(6px)}8%,88%{opacity:1;transform:none}100%{opacity:0}}
  @keyframes pulse{50%{opacity:.68}}
  @media(prefers-reduced-motion:reduce){.st{opacity:1;animation:none}.glow{animation:none}}
</style>
<rect x=".5" y=".5" width="239" height="179" rx="10" class="card"/>
<text x="16" y="26" class="m" fill="var(--mu)" font-size="9" letter-spacing="1.5">APPLICATION PROFILE</text>
<text x="224" y="26" text-anchor="end" class="b" fill="var(--ac)" font-size="10" font-weight="600">.NET FLOW</text>

<g class="st" style="animation-delay:0s">
 <title>Request entry: the incoming HTTP request reaches the ASP.NET application pipeline.</title>
 <rect x="16" y="140" width="208" height="17" rx="2" class="fr"/>
 <text x="21" y="152" class="m lbl">http_request</text>
</g>

<g class="st" style="animation-delay:.35s">
 <title>ASP.NET routing and controller stage. Hovering this frame in the standalone SVG highlights it.</title>
 <rect x="16" y="122" width="132" height="17" rx="2" class="fr hot glow"/>
 <text x="21" y="134" class="m lbl on">aspnet_controller</text>
</g>
<g class="st" style="animation-delay:.35s">
 <title>Middleware and request pipeline work.</title>
 <rect x="150" y="122" width="74" height="17" rx="2" class="fr"/>
 <text x="155" y="134" class="m lbl">pipeline</text>
</g>

<g class="st" style="animation-delay:.70s">
 <title>C sharp business service: application rules and orchestration.</title>
 <rect x="16" y="104" width="92" height="17" rx="2" class="fr hot glow"/>
 <text x="21" y="116" class="m lbl on">C# service</text>
</g>
<g class="st" style="animation-delay:.70s">
 <title>Object mapping and validation stage.</title>
 <rect x="110" y="104" width="38" height="17" rx="2" class="fr"/>
</g>
<g class="st" style="animation-delay:.70s">
 <title>Integration branch for service calls.</title>
 <rect x="150" y="104" width="74" height="17" rx="2" class="fr"/>
 <text x="155" y="116" class="m lbl">WCF / ASMX</text>
</g>

<g class="st" style="animation-delay:1.05s">
 <title>ADO.NET repository and data access layer.</title>
 <rect x="16" y="86" width="70" height="17" rx="2" class="fr hot glow"/>
 <text x="21" y="98" class="m lbl on">ADO.NET</text>
</g>
<g class="st" style="animation-delay:1.05s">
 <title>Database connection and command execution.</title>
 <rect x="110" y="86" width="38" height="17" rx="2" class="fr"/>
 <text x="115" y="98" class="m lbl">conn.</text>
</g>
<g class="st" style="animation-delay:1.05s">
 <title>SAP BW and SAP ECC integration endpoint through WCF or ASMX services.</title>
 <rect x="150" y="86" width="74" height="17" rx="2" class="fr"/>
 <text x="155" y="98" class="m lbl">SAP BW/ECC</text>
</g>

<g class="st" style="animation-delay:1.40s">
 <title>SQL Server stored procedure and query execution stage.</title>
 <rect x="16" y="68" width="52" height="17" rx="2" class="fr hot glow"/>
 <text x="21" y="80" class="m lbl on">SQL proc</text>
</g>
<g class="st" style="animation-delay:1.40s">
 <title>SQL query plan and data retrieval.</title>
 <rect x="70" y="68" width="78" height="17" rx="2" class="fr"/>
 <text x="75" y="80" class="m lbl">query plan</text>
</g>

<g class="st" style="animation-delay:1.75s">
 <title>Database engine at the base of this conceptual request path.</title>
 <rect x="16" y="50" width="30" height="17" rx="2" class="fr hot glow"/>
 <text x="21" y="62" class="m lbl on">DB</text>
</g>
<text x="16" y="172" class="m" fill="var(--mu)" font-size="7.5">.NET request path · illustrative, not measured</text>
</svg>