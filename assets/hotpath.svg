<svg xmlns="http://www.w3.org/2000/svg" width="360" height="236" viewBox="0 0 360 236" role="img" aria-labelledby="title desc">
<title id="title">Illustrative .NET application hot path</title>
<desc id="desc">A flame-graph-inspired conceptual request path from an HTTP request through ASP.NET, C sharp business logic, ADO.NET repository and SQL Server stored procedure, with WCF or ASMX as an integration branch. This is not a measured runtime profile.</desc>
<defs>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#087cf0"/>
    <stop offset="1" stop-color="#4a9cf4"/>
  </linearGradient>
  <linearGradient id="blue2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1769d2"/>
    <stop offset="1" stop-color="#75b6f7"/>
  </linearGradient>
</defs>
<rect x=".6" y=".6" width="358.8" height="234.8" rx="12" fill="#f5f5f7" stroke="#d2d2d7"/>
<text x="20" y="27" fill="#5f6f82" font-family="Consolas,Menlo,monospace" font-size="9.5" letter-spacing="1.8">APPLICATION HOT PATH</text>
<text x="340" y="27" text-anchor="end" fill="#0969da" font-family="Consolas,Menlo,monospace" font-size="9">.NET</text>
<line x1="20" y1="39" x2="340" y2="39" stroke="#d2d2d7"/>
<g font-family="Consolas,Menlo,monospace" font-size="10.5">
  <rect x="20" y="53" width="310" height="22" rx="3" fill="#e2e5eb"/>
  <rect x="20" y="53" width="246" height="22" rx="3" fill="url(#blue)"/>
  <text x="28" y="68" fill="#fff">HTTP request · ASP.NET</text>

  <rect x="37" y="82" width="293" height="22" rx="3" fill="#e2e5eb"/>
  <rect x="37" y="82" width="218" height="22" rx="3" fill="url(#blue2)"/>
  <text x="45" y="97" fill="#fff">Controller · C#</text>

  <rect x="54" y="111" width="276" height="22" rx="3" fill="#e2e5eb"/>
  <rect x="54" y="111" width="188" height="22" rx="3" fill="#2686e8"/>
  <text x="62" y="126" fill="#fff">Business service</text>

  <rect x="71" y="140" width="259" height="22" rx="3" fill="#e2e5eb"/>
  <rect x="71" y="140" width="207" height="22" rx="3" fill="#3b91ec"/>
  <text x="79" y="155" fill="#fff">ADO.NET · Repository</text>

  <rect x="88" y="169" width="242" height="22" rx="3" fill="#e2e5eb"/>
  <rect x="88" y="169" width="164" height="22" rx="3" fill="#0969da"/>
  <text x="96" y="184" fill="#fff">SQL stored procedure</text>
</g>
<path d="M148 133v6m-4-4 4 4 4-4" fill="none" stroke="#64748b" stroke-width="1.3"/>
<rect x="20" y="202" width="320" height="19" rx="4" fill="#eaf2fc"/>
<circle cx="31" cy="211.5" r="3" fill="#0d9488"/>
<text x="41" y="215" fill="#42566f" font-family="Consolas,Menlo,monospace" font-size="8.2">WCF / ASMX · SAP BW / ECC integration branch</text>
<text x="340" y="231" text-anchor="end" fill="#7b8492" font-family="Consolas,Menlo,monospace" font-size="7.5">CONCEPTUAL FLOW · NOT MEASURED</text>
</svg>